name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Upgrade the audited environment's build tools explicitly
        run: python -m pip install --upgrade -c constraints.txt pip setuptools
      - name: Install locked project and isolated build dependencies
        run: python -m pip install -c constraints.txt --build-constraint constraints.txt -e '.[mlops,spark,dev]'
      - name: Verify installed environment
        run: |
          python -c "import importlib.metadata as m; assert m.version('setuptools') == '84.2.1'; print('setuptools', m.version('setuptools'))"
          python -m pip check
          install -d -m 700 "$RUNNER_TEMP/fintech-dvc-site-cache"
          printf 'DVC_SITE_CACHE_DIR=%s\n' "$RUNNER_TEMP/fintech-dvc-site-cache" >> "$GITHUB_ENV"
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=fintech_risk --cov-report=xml
      - run: bandit -r src dashboard scripts -ll
      - name: Audit every dependency with an expiring, exact-match risk exception
        run: python -m fintech_risk.dependency_audit
      - name: Preserve raw audit and policy decision, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: reports/generated/ci-security-audit*.json
          if-no-files-found: warn
      - run: docker build --target runtime -t fintech-ci:${{ github.sha }} .
      - run: docker run --rm fintech-ci:${{ github.sha }} python -c "from fintech_risk.api import app; assert '/predict/sme' in app.openapi()['paths']"
  # Full datasets and retraining are intentionally absent from pull-request CI.
